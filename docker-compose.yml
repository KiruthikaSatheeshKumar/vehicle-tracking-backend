services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tracking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]

  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    command: mosquitto -c /mosquitto-no-auth.conf

  api:
    build: .
    depends_on: [db, mqtt]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/tracking
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      SECRET_KEY: "assessment-secret-change-me"
    ports: ["8000:8000"]

volumes:
  postgres_data:
